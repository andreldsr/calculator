services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      PORT: "8080"
    ports:
      # Published so the README's cURL examples can call the API directly.
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
