server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS. Resolving per request (via the variable below)
    # follows the backend to a new IP when its container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # A proxy_pass with no URI part passes /api/v1/calculate through unchanged.
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        # Matches the backend's 1 MiB body limit.
        client_max_body_size 1m;

        # Errors raised by nginx itself use the API's JSON envelope too.
        error_page 413 = @api_too_large;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_too_large {
        default_type application/json;
        return 413 '{"error":"request body too large"}\n';
    }

    location @api_unavailable {
        default_type application/json;
        return 503 '{"error":"calculator service unavailable"}\n';
    }

    # Vite puts a content hash in asset names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
